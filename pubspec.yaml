name: f_locker
description: F-Locker - a portable, encrypted locker for videos, images, music, documents, apps and zips.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  file_picker: ^10.3.8
  open_filex: ^4.7.0
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
