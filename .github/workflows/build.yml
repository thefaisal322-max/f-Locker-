name: Build F-Locker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create --org com.flocker --project-name f_locker --platforms=android .
      - name: Configure Android app
        shell: bash
        run: |
          ls -R android/app/src/main | head -40 > ci.log
          bash tool/configure_android.sh >> ci.log 2>&1; code=$?; cat ci.log; exit $code
      - run: flutter pub get
      - name: Test encryption
        shell: bash
        run: flutter test --reporter expanded 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
      # One small APK per phone type instead of one big APK for all of them.
      - name: Build small APKs
        shell: bash
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}
      - name: Name the APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk F-Locker.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk F-Locker-old-phones.apk
          ls -lh F-Locker*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: F-Locker-android
          path: F-Locker*.apk

  windows:
    name: Windows (single F-Locker.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows project files
        run: flutter create --org com.flocker --project-name f_locker --platforms=windows .
      - name: Configure Windows app
        shell: pwsh
        run: ./tool/configure_windows.ps1
      - run: flutter pub get
      - name: Build app
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols
      - name: Pack everything into one F-Locker.exe
        shell: pwsh
        run: |
          $app = "app"
          Copy-Item -Recurse build/windows/x64/runner/Release $app
          # C++ runtime, so it runs on any PC without installing anything.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $app }
          }
          Compress-Archive -Path "$app\*" -DestinationPath app.zip -CompressionLevel Optimal
          (Get-FileHash app.zip -Algorithm SHA256).Hash.Substring(0, 16) | Set-Content -NoNewline version.txt
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /out:F-Locker.exe `
            /win32icon:windows\runner\resources\app_icon.ico `
            /resource:app.zip,app.zip /resource:version.txt,version.txt `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Windows.Forms.dll `
            tool\launcher\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item F-Locker.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: F-Locker-windows
          path: F-Locker.exe

  release:
    name: Publish download links
    needs: [android, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: F-Locker 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            - **F-Locker.apk** - Android phones (almost all phones from the last years).
            - **F-Locker-old-phones.apk** - only if F-Locker.apk does not install (older 32-bit phones).
            - **F-Locker.exe** - Windows. One file, nothing to install. Put it anywhere (USB too) and double-click.

            Files you add are moved into F-Locker. Use Restore to put them back where they were.
          files: |
            dist/F-Locker.apk
            dist/F-Locker-old-phones.apk
            dist/F-Locker.exe
